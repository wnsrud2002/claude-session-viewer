<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
:root { color-scheme:dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#9da7b3; --faint:#7d8590;
  --accent:#56d364; --star:#e3b341; --danger:#ff7b72; --sel:#1f2937;
  --h0:#161b22; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; height:100vh; display:grid; grid-template-rows:auto auto 1fr auto;
  font:13px/1.55 ui-monospace, "SF Mono", Menlo, monospace; background:var(--bg); color:var(--fg); }
::selection { background:var(--accent); color:var(--bg); }
button, select, summary, textarea { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:1px 8px; cursor:pointer; }
button:hover, summary:hover, select:hover { border-color:var(--accent); color:var(--accent); }
button.danger:hover { border-color:var(--danger); color:var(--danger); }
:focus-visible { outline:1px solid var(--accent); outline-offset:1px; }
header { display:flex; align-items:center; gap:14px; padding:10px 16px; border-bottom:1px solid var(--line); }
.prompt { color:var(--accent); white-space:nowrap; }
.search { flex:1; display:flex; align-items:center; gap:6px; }
#q { flex:1; background:none; border:0; outline:0; color:var(--fg); font:inherit; caret-color:var(--accent); padding:0; }
#q::placeholder { color:var(--faint); }
.cursor { width:.6em; height:1.1em; background:var(--accent); animation:blink 1s steps(1) infinite; }
.search:focus-within .cursor, .search:has(#q:not(:placeholder-shown)) .cursor { display:none; }
details { position:relative; }
#proj { position:absolute; z-index:10; top:130%; right:0; max-height:320px; overflow:auto; padding:8px 12px;
  background:var(--panel); border:1px solid var(--line); white-space:nowrap; }
#proj label { display:block; cursor:pointer; }
#proj input { accent-color:var(--accent); }
#bar { display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:8px 16px; border-bottom:1px solid var(--line); }
#views { display:flex; gap:6px; }
#views .n { color:var(--dim); margin-left:6px; }
#views button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
#views button.on .n { color:var(--bg); }
#heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 9px); gap:2px; }
#heat div { width:9px; height:9px; cursor:pointer; }
#heat div.on { outline:1px solid var(--fg); }
#cards { display:flex; gap:18px; margin-left:auto; }
.card b { color:var(--accent); font-weight:500; font-size:15px; margin-right:4px; }
.card span { color:var(--dim); }
main { display:grid; grid-template-columns:minmax(0, 380px) minmax(0, 1fr); min-height:0; }
#list { overflow:auto; margin:0; padding:4px 0; list-style:none; border-right:1px solid var(--line); }
#list li { position:relative; padding:5px 12px 5px 26px; cursor:pointer; }
#list li:hover { background:var(--panel); }
#list li.sel { background:var(--sel); }
#list li.sel::before { content:'>'; position:absolute; left:10px; color:var(--accent); }
#list li.archiveOnly .t { color:var(--dim); }
#list small { display:block; color:var(--faint); }
#list .snip { color:var(--dim); font-style:italic; }
.badge { font-size:11px; color:var(--dim); margin-left:6px; }
.badge.star { color:var(--star); }
.badge.live { color:var(--accent); }
#right { min-height:0; display:grid; grid-template-rows:auto 1fr; }
#tabs { display:flex; gap:6px; padding:6px 12px; border-bottom:1px solid var(--line); }
#tabs button.on { color:var(--accent); border-color:var(--accent); }
#map, #flow { min-height:0; overflow:auto; }
#map svg { display:block; }
#map circle.twinkle { animation:twinkle 2.4s ease-in-out infinite; filter:drop-shadow(0 0 3px var(--accent)); }
#map circle.star { filter:drop-shadow(0 0 4px var(--star)); }
#flow { padding:14px 18px; }
.resume { display:flex; gap:8px; align-items:center; padding:6px 10px; background:var(--panel); border:1px solid var(--line); }
.resume code { flex:1; overflow-x:auto; white-space:nowrap; font:inherit; }
#flow h3 { font-weight:500; color:var(--accent); margin:14px 0 6px; }
.msg { padding:6px 0; border-bottom:1px dashed var(--line); }
.who { color:var(--dim); }
.mark.user { color:var(--accent); }
.time { color:var(--faint); }
.tool { color:var(--star); padding-left:1.6em; }
.body { white-space:pre-wrap; word-break:break-word; padding-left:1.6em; }
.msg.user .body { color:#fff; }
.folded { cursor:pointer; }
.folded .body { max-height:6.2em; overflow:hidden; mask-image:linear-gradient(#000 55%, transparent); }
.gap { color:var(--faint); text-align:center; padding:4px 0; }
.empty { color:var(--faint); padding:24px; }
footer { display:flex; align-items:center; gap:10px; padding:5px 16px; border-top:1px solid var(--line); color:var(--faint); }
#hint { margin-left:auto; }
dialog { background:var(--panel); color:var(--fg); border:1px solid var(--accent); padding:16px 20px; }
dialog::backdrop { background:rgba(0,0,0,.6); }
dialog pre { margin:0 0 12px; font:inherit; }
.pick { position:absolute; right:10px; top:7px; opacity:0; accent-color:var(--accent); }
#list li:hover .pick, #list.picking .pick, .pick:checked { opacity:1; }
.acts { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
#note { display:block; width:100%; resize:vertical; cursor:text; padding:4px 8px; }
#note::placeholder { color:var(--faint); }
#status { display:flex; align-items:center; gap:8px; color:var(--fg); }
#toast { position:fixed; left:50%; bottom:44px; transform:translateX(-50%); padding:6px 14px;
  background:var(--panel); border:1px solid var(--accent); display:flex; gap:10px; align-items:center; }
@keyframes blink { 50% { opacity:0; } }
@keyframes twinkle { 50% { opacity:.35; } }
@media (prefers-reduced-motion: reduce) { .cursor, #map circle.twinkle { animation:none; } }
@media (max-width:760px) {
  main { grid-template-columns:1fr; grid-template-rows:40vh 1fr; }
  #list { border-right:0; border-bottom:1px solid var(--line); }
  #cards { margin-left:0; }
}
</style>
</head>
<body>
<header>
  <span class="prompt">~/.claude/sessions</span>
  <div class="search"><span class="prompt">$ grep</span><span class="cursor"></span><input id="q" type="search" placeholder="대화 내용 검색 ( / )" autocomplete="off"></div>
  <details><summary>프로젝트</summary><div id="proj"></div></details>
  <select id="range"><option value="7">7일</option><option value="30">30일</option><option value="0" selected>전체</option></select>
</header>
<section id="bar"><div id="views"></div><div id="heat"></div><div id="cards"></div></section>
<main>
  <ul id="list"></ul>
  <section id="right">
    <nav id="tabs"><button data-tab="map" class="on">지도</button><button data-tab="flow">대화 흐름</button></nav>
    <div id="map"></div>
    <div id="flow" hidden><p class="empty">세션을 선택하세요</p></div>
  </section>
</main>
<footer><span id="status"></span><span id="hint">↑↓ 이동 · Enter 열기 · / 검색 · ? 도움말</span></footer>
<div id="toast" hidden></div>
<dialog id="help"><pre>
↑ ↓  j k   목록 이동
Enter      대화 흐름 열기
/          검색
Esc        검색 지우기 · 선택 해제
s          즐겨찾기
a          보관
n          메모
x          선택 (Shift+클릭으로 범위)
Delete     삭제 (휴지통 보기에선 영구 삭제)
?          이 도움말
</pre><form method="dialog"><button>닫기</button></form></dialog>
<script>
const $ = s => document.querySelector(s);
const DAY = 864e5;
const state = { sessions: [], hits: null, projects: new Set(), days: 0, day: null, view: 'all', selected: null, checked: new Set() };
const VIEWS = {
  all: ['전체', s => !s.trashed],
  star: ['★', s => s.star && !s.trashed],
  archive: ['보관', s => (s.archived || s.archiveOnly) && !s.trashed],
  trash: ['휴지통', s => s.trashed],
};

// 사용자 텍스트가 HTML 로 해석되지 않도록 DOM 은 전부 이 헬퍼로 만든다 (innerHTML 금지)
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}
async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}
const dayKey = t => new Date(t).toLocaleDateString('sv');  // 'sv' 로캘이 로컬 시간대 YYYY-MM-DD 를 줌
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const byId = id => state.sessions.find(s => s.id === id);

const matchBase = s => VIEWS[state.view][1](s) && (!state.projects.size || state.projects.has(s.project)) && (!state.hits || state.hits.has(s.id));
function filtered() {
  const since = state.days ? Date.now() - state.days * DAY : 0;
  return state.sessions.filter(s => matchBase(s) && (!since || Date.parse(s.end) >= since) && (!state.day || dayKey(s.start) === state.day));
}

function renderViews() {
  $('#views').replaceChildren(...Object.entries(VIEWS).map(([key, [label, test]]) => {
    const b = el('button', { onclick: () => { state.view = key; render(); } },
      label, el('span', { className: 'n', textContent: state.sessions.filter(test).length }));
    b.classList.toggle('on', state.view === key);
    return b;
  }));
}

function renderHeat() {
  // 날짜 필터를 걸어도 다른 날짜를 다시 고를 수 있도록 잔디는 기간·날짜 필터를 무시
  const counts = {};
  state.sessions.filter(matchBase).forEach(s => { const k = dayKey(s.start); counts[k] = (counts[k] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - 7 * 26 - d.getDay());
  const cells = [];
  for (const today = new Date(); d <= today; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d), n = counts[k] || 0;
    const c = el('div', { title: `${k}: 세션 ${n}개`, onclick: () => { state.day = state.day === k ? null : k; render(); } });
    c.style.background = `var(--h${n ? Math.ceil(n / max * 4) : 0})`;
    c.classList.toggle('on', state.day === k);
    cells.push(c);
  }
  $('#heat').replaceChildren(...cells);
}

function renderCards(list) {
  const sum = f => list.reduce((a, s) => a + (s[f] ?? 0), 0);
  const card = (v, label) => el('div', { className: 'card' }, el('b', { textContent: v }), el('span', { textContent: label }));
  $('#cards').replaceChildren(
    card(list.length, '세션'),
    card(list.some(s => s.costUSD != null) ? '$' + sum('costUSD').toFixed(2) : '—', '비용'),
    card(fmt(sum('tokens')), '토큰'),
    card(`+${sum('linesAdded')}/−${sum('linesRemoved')}`, '줄'));
}

function row(s) {
  const badges = [s.star && ['★', 'star'], s.live && ['[진행 중]', 'live'], s.archiveOnly ? ['[보관본]', ''] : s.archived && ['[보관]', '']];
  const li = el('li', { className: s.archiveOnly ? 'archiveOnly' : '', onclick: () => select(s.id) },
    el('span', { className: 't', textContent: s.title }),
    ...badges.filter(Boolean).map(([t, c]) => el('span', { className: 'badge ' + c, textContent: t })),
    el('small', { textContent: `${s.project} · ${dayKey(s.start)} · 메시지 ${s.messageCount}` }));
  if (s.note) li.append(el('small', { textContent: '✎ ' + s.note.split('\n')[0] }));
  if (state.hits) li.append(el('small', { className: 'snip', textContent: '…' + state.hits.get(s.id) + '…' }));
  li.prepend(el('input', { type: 'checkbox', className: 'pick', checked: state.checked.has(s.id),
    onclick: e => { e.stopPropagation(); toggleCheck(s.id, e.shiftKey); } }));
  li.dataset.id = s.id;
  li.classList.toggle('sel', s.id === state.selected);
  return li;
}

function renderList(list) {
  if (!list.length) {
    return $('#list').replaceChildren(el('li', { className: 'empty', textContent: state.sessions.length ? '조건에 맞는 세션이 없습니다' : '세션이 없습니다' }));
  }
  $('#list').replaceChildren(...list.map(row));
}

function renderProjects() {
  const names = [...new Set(state.sessions.map(s => s.project))].sort();
  $('#proj').replaceChildren(...names.map(n => {
    const cb = el('input', { type: 'checkbox', checked: state.projects.has(n),
      onchange: () => { cb.checked ? state.projects.add(n) : state.projects.delete(n); render(); } });
    return el('label', {}, cb, ' ' + n);
  }));
}

function render() {
  const list = filtered();
  renderViews();
  renderHeat();
  renderCards(list);
  renderList(list);
  renderMap(list);
  renderBulk();
}

async function reload() {
  state.sessions = await api('/api/sessions');
  renderProjects();
  render();
}

function focusRow(id) {
  state.selected = id;
  renderList(filtered());
  d3.selectAll('#map circle').style('stroke', d => d.id === id ? 'var(--fg)' : 'none');
  document.querySelector(`#list li[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' });
}

function select(id) {
  focusRow(id);
  showTab('flow');
  return renderFlow(id);
}

function showTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#map').hidden = name !== 'map';
  $('#flow').hidden = name !== 'flow';
  if (name === 'map') renderMap(filtered());
}
$('#tabs').onclick = e => e.target.dataset.tab && showTab(e.target.dataset.tab);

let sim;
function renderMap(list) {
  const box = $('#map');
  if (box.hidden) return;
  sim?.stop();
  if (!list.length) return box.replaceChildren(el('p', { className: 'empty', textContent: '표시할 세션이 없습니다' }));
  const { width: W, height: H } = box.getBoundingClientRect();
  const now = Date.now(), oldest = Math.min(now - DAY, ...list.map(s => Date.parse(s.start)));
  const nodes = [
    ...[...new Set(list.map(s => s.project))].map(p => ({ id: 'p:' + p, label: p, r: 18, project: true })),
    ...list.map(s => ({ id: s.id, label: s.title, r: Math.min(24, 4 + Math.sqrt(s.messageCount) * 1.5), s })),
  ];
  const links = list.map(s => ({ source: 'p:' + s.project, target: s.id }));
  const svg = d3.create('svg').attr('viewBox', [0, 0, W, H]).attr('width', W).attr('height', H);
  const link = svg.append('g').style('stroke', 'var(--line)').selectAll('line').data(links).join('line');
  // SVG 속성(fill=) 에는 CSS 변수가 안 먹어서 색은 전부 style 로 지정
  const node = svg.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r', d => d.r)
    .attr('class', d => d.project ? '' : [d.s.star && 'star', now - Date.parse(d.s.end) < 7 * DAY && 'twinkle'].filter(Boolean).join(' '))
    .style('fill', d => d.project ? 'var(--faint)' : d.s.star ? 'var(--star)' : 'var(--accent)')
    .style('fill-opacity', d => d.project ? 0.5 : 0.25 + 0.75 * (Date.parse(d.s.start) - oldest) / (now - oldest))
    .style('stroke', d => d.id === state.selected ? 'var(--fg)' : 'none')
    .style('stroke-width', 2)
    .style('cursor', d => d.project ? 'grab' : 'pointer')
    .on('click', (e, d) => d.project || select(d.id))
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));
  node.append('title').text(d => d.project ? d.label : `${d.label}\n${dayKey(d.s.start)} · 메시지 ${d.s.messageCount}`);
  const label = svg.append('g').selectAll('text').data(nodes.filter(d => d.project)).join('text')
    .text(d => d.label).attr('font-size', 11).attr('text-anchor', 'middle').attr('dy', -22).style('fill', 'var(--dim)');
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(40))
    .force('charge', d3.forceManyBody().strength(-30))
    .force('collide', d3.forceCollide(d => d.r + 1))
    .force('center', d3.forceCenter(W / 2, H / 2))
    // 프로젝트 무리끼리는 링크가 없어 서로 밀어내며 화면 밖으로 흩어지므로 중앙으로 당김
    .force('x', d3.forceX(W / 2).strength(0.08))
    .force('y', d3.forceY(H / 2).strength(0.08))
    .on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('cx', d => d.x).attr('cy', d => d.y);
      label.attr('x', d => d.x).attr('y', d => d.y);
    });
  box.replaceChildren(svg.node());
}

const fmtGap = ms => ms < 36e5 ? Math.round(ms / 6e4) + '분' : (ms / 36e5).toFixed(1) + '시간';

function resumeLine(s, id) {
  // 경로에 공백·따옴표가 있어도 셸에 그대로 붙여넣을 수 있게 작은따옴표로 감쌈
  const cmd = `cd '${(s.cwd ?? '~').replaceAll("'", "'\\''")}' && claude --resume ${id}`;
  const code = el('code', { textContent: cmd });
  const copy = el('button', { textContent: '복사' });
  copy.onclick = () => navigator.clipboard.writeText(cmd).then(
    () => { copy.textContent = '복사됨'; },
    // 클립보드 권한이 막힌 브라우저에서도 손으로 복사할 수 있게 명령을 선택해 둠
    () => { getSelection().selectAllChildren(code); copy.textContent = '⌘C 로 복사'; });
  return el('div', { className: 'resume' }, el('span', { className: 'prompt', textContent: '$' }), code, copy);
}

function flowHeader(s, id) {
  const acts = s.trashed
    ? [btn('복원', () => restoreIds([id])), btn('영구 삭제', () => purgeIds([id]), 'danger')]
    : [btn(s.star ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기', () => toggleStar(id)),
       s.archiveOnly ? btn('되살리기', () => reviveId(id)) : btn(s.archived ? '보관 갱신' : '보관', () => archiveIds([id])),
       ...(s.archived || s.archiveOnly ? [btn('보관 해제', () => unarchiveId(id))] : []),
       ...(s.archiveOnly ? [] : [btn('삭제', () => trashIds([id]), 'danger')])];
  const note = el('textarea', { id: 'note', rows: 2, value: s.note, placeholder: '메모 — 다른 곳을 누르면 저장' });
  note.onblur = () => note.value !== s.note && saveNote(id, note.value).catch(fail);
  // 원본이 없는 세션은 resume 해도 열리지 않으므로 명령을 보여주지 않음
  return el('div', {}, ...(s.trashed || s.archiveOnly ? [] : [resumeLine(s, id)]), el('div', { className: 'acts' }, ...acts), note);
}

async function renderFlow(id) {
  const s = byId(id);
  const box = $('#flow');
  box.replaceChildren(el('p', { className: 'empty', textContent: '불러오는 중…' }));
  let msgs;
  try {
    msgs = await api('/api/session/' + id);
  } catch (err) {
    return box.replaceChildren(el('p', { className: 'empty', textContent: '불러오기 실패: ' + err.message }));
  }
  if (state.selected !== id) return;  // 느린 응답이 더 최근에 고른 세션을 덮어쓰지 않도록
  let prev = null;
  const items = msgs.flatMap(m => {
    const t = Date.parse(m.timestamp), gap = prev ? t - prev : 0;
    prev = t;
    const card = el('div', { className: 'msg ' + m.role },
      el('div', { className: 'who' },
        el('span', { className: 'mark ' + m.role, textContent: m.role === 'user' ? '❯ ' : '● ' }),
        m.role === 'user' ? '나 ' : 'Claude ',
        el('span', { className: 'time', textContent: new Date(t).toLocaleString() })),
      ...m.tools.map(n => el('div', { className: 'tool', textContent: '⏺ ' + n })),
      m.text ? el('div', { className: 'body', textContent: m.text }) : '');
    if (m.text.length > 300) {
      card.classList.add('folded');
      card.onclick = () => card.classList.toggle('folded');
    }
    return gap > 6e4 ? [el('div', { className: 'gap', textContent: `── +${fmtGap(gap)} ──` }), card] : [card];
  });
  box.replaceChildren(flowHeader(s, id), el('h3', { textContent: '# ' + s.title }), ...items);
}

async function post(id, action, body = {}) {
  const r = await fetch(`/api/session/${id}/${action}`, {
    method: 'POST', headers: { 'X-Session-Viewer': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.replaceChildren(msg, ...(undo ? [el('button', { textContent: '되돌리기', onclick: () => { t.hidden = true; undo(); } })] : []));
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
const fail = err => toast('실패: ' + err.message);
const btn = (label, fn, cls = '') => el('button', { textContent: label, className: cls, onclick: () => Promise.resolve().then(fn).catch(fail) });

async function afterChange(msg, undo) {
  await reload();
  if (!$('#flow').hidden && state.selected && byId(state.selected)) renderFlow(state.selected);
  if (msg) toast(msg, undo);
}
// 하나가 실패해도 나머지는 계속 처리하고, 성공한 것만 되돌릴 수 있게 결과를 나눠 돌려줌
async function each(ids, action, body = () => ({})) {
  const done = [], errors = [];
  for (const id of ids) {
    try {
      await post(id, action, body(id));
      done.push(id);
    } catch (err) {
      errors.push(`${byId(id)?.title ?? id}: ${err.message}`);
    }
  }
  state.checked.clear();
  return { done, errors };
}
const summary = (verb, { done, errors }) =>
  `${verb} ${done.length}개` + (errors.length ? ` · 실패 ${errors.length}개 (${errors[0]}${errors.length > 1 ? ' 외' : ''})` : '');

async function toggleStar(id) { await post(id, 'meta', { star: !byId(id).star }); await afterChange(); }
async function saveNote(id, note) { await post(id, 'meta', { note }); await reload(); toast('메모 저장됨'); }

async function archiveIds(ids) {
  ids = ids.filter(id => !byId(id)?.archiveOnly);
  if (!ids.length) return;
  await afterChange(summary('보관', await each(ids, 'archive')));
}
async function trashIds(ids) {
  ids = ids.filter(id => !byId(id)?.archiveOnly);
  if (!ids.length) return toast('보관본만 있는 세션은 삭제 대신 보관 해제를 쓰세요');
  const live = ids.filter(id => byId(id)?.live);
  if (live.length && !confirm(`최근 5분 안에 기록된 세션 ${live.length}개가 있습니다.\n진행 중인 대화라면 Claude Code 가 파일을 다시 만들 수 있습니다. 그래도 삭제할까요?`)) return;
  const r = await each(ids, 'trash', id => ({ force: live.includes(id) }));
  await afterChange(summary('삭제됨', r), r.done.length ? () => restoreIds(r.done).catch(fail) : null);
}
async function restoreIds(ids) { await afterChange(summary('복원', await each(ids, 'restore'))); }
async function purgeIds(ids) {
  if (!confirm(`${ids.length}개 세션을 영구 삭제합니다. 되돌릴 수 없습니다.`)) return;
  await afterChange(summary('영구 삭제', await each(ids, 'purge')));
}
async function reviveId(id) { await post(id, 'revive'); await afterChange('되살렸습니다 — 이제 claude --resume 가능'); }
async function unarchiveId(id) {
  try {
    await post(id, 'unarchive');
  } catch (err) {
    // 목록의 archiveOnly 표시는 오래됐을 수 있어, 서버가 유일한 사본이라고 알려줄 때 확인받음
    if (!err.message.includes('유일한 사본')) throw err;
    if (!confirm(err.message + '. 보관을 해제하면 되돌릴 수 없습니다.')) return;
    await post(id, 'unarchive', { force: true });
  }
  await afterChange('보관 해제');
}

let lastPick = null;
function toggleCheck(id, range) {
  const ids = filtered().map(s => s.id);
  const [a, b] = [ids.indexOf(lastPick), ids.indexOf(id)].sort((x, y) => x - y);
  const span = range && a >= 0 ? ids.slice(a, b + 1) : [id];
  const on = !state.checked.has(id);
  span.forEach(x => on ? state.checked.add(x) : state.checked.delete(x));
  lastPick = id;
  renderList(filtered());
  renderBulk();
}
function renderBulk() {
  const visible = new Set(filtered().map(s => s.id));
  // 보기·필터가 바뀌어 안 보이게 된 세션은 일괄 동작 대상에서 뺌
  for (const id of state.checked) if (!visible.has(id)) state.checked.delete(id);
  const ids = [...state.checked];
  $('#list').classList.toggle('picking', ids.length > 0);
  if (!ids.length) return $('#status').replaceChildren();
  $('#status').replaceChildren(`${ids.length}개 선택`,
    ...(state.view === 'trash'
      ? [btn('복원', () => restoreIds(ids)), btn('영구 삭제', () => purgeIds(ids), 'danger')]
      : [btn('보관', () => archiveIds(ids)), btn('삭제', () => trashIds(ids), 'danger')]),
    btn('선택 해제', () => { state.checked.clear(); renderList(filtered()); renderBulk(); }));
}

const move = d => () => {
  const list = filtered();
  if (!list.length) return;
  const i = list.findIndex(s => s.id === state.selected);
  focusRow(list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + d))].id);
};
const keys = {
  ArrowDown: move(1), j: move(1), ArrowUp: move(-1), k: move(-1),
  Enter: () => state.selected && select(state.selected),
  '/': () => $('#q').focus(),
  '?': () => $('#help').showModal(),
  Escape: () => {
    const a = document.activeElement;
    if (a === $('#q') && a.value) { a.value = ''; a.dispatchEvent(new Event('input')); }
    a?.blur?.();
  },
};
// 필터로 가려진 세션이 단축키로 지워지지 않도록 지금 목록에 보이는 선택만 대상으로 함
const targets = () => state.checked.size ? [...state.checked]
  : filtered().some(s => s.id === state.selected) ? [state.selected] : [];
const run = fn => () => Promise.resolve().then(fn).catch(fail);
const del = run(() => targets().length && (state.view === 'trash' ? purgeIds(targets()) : trashIds(targets())));
const escBase = keys.Escape;
Object.assign(keys, {
  s: run(() => state.selected && state.view !== 'trash' && toggleStar(state.selected)),
  a: run(() => state.view !== 'trash' && targets().length && archiveIds(targets())),
  n: () => state.selected && state.view !== 'trash' && select(state.selected).then(() => $('#note')?.focus()),
  x: () => state.selected && toggleCheck(state.selected),
  Delete: del,
  Backspace: del,
  Escape: () => {
    escBase();
    if (state.checked.size) { state.checked.clear(); renderList(filtered()); renderBulk(); }
  },
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || $('#help').open) return;
  // 입력칸에서 글자를 칠 때 단축키가 먹으면 안 되므로 Esc 만 통과
  if (e.target.matches?.('input:not([type=checkbox]), textarea, select') && e.key !== 'Escape') return;
  const fn = keys[e.key];
  if (fn) { e.preventDefault(); fn(e); }
});

let timer;
$('#q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = e.target.value.trim();
    try {
      state.hits = q ? new Map((await api('/api/search?q=' + encodeURIComponent(q))).map(h => [h.id, h.snippet])) : null;
    } catch (err) {
      state.hits = new Map();
      console.error(err);
    }
    render();
  }, 300);
};
$('#range').onchange = e => { state.days = +e.target.value; render(); };

reload().catch(err => $('#list').replaceChildren(el('li', { className: 'empty', textContent: '서버 오류: ' + err.message })));
</script>
</body>
</html>
