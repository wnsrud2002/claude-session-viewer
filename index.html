<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
:root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --panel:#f6f8fa; --accent:#0969da;
  --h0:#ebedf0; --h1:#9be9a8; --h2:#40c463; --h3:#30a14e; --h4:#216e39;
  --user:#ddf4ff; --asst:#f6f8fa; --tool:#fff8c5; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --panel:#161b22; --accent:#4493f8;
  --h0:#161b22; --h1:#0e4429; --h2:#006d32; --h3:#26a641; --h4:#39d353;
  --user:#0c2d6b; --asst:#161b22; --tool:#3b2e00; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; height:100vh; display:grid; grid-template-rows:auto auto 1fr;
  font:14px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--fg); }
header, #dash { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
input, select, button, summary { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 8px; cursor:pointer; }
#q { flex:1; min-width:200px; cursor:text; }
details { position:relative; }
#proj { position:absolute; z-index:10; top:110%; left:0; max-height:300px; overflow:auto; padding:8px;
  background:var(--bg); border:1px solid var(--line); border-radius:6px; white-space:nowrap; }
#proj label { display:block; }
#heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 11px); gap:2px; }
#heat div { width:11px; height:11px; border-radius:2px; cursor:pointer; }
#heat div.on { outline:2px solid var(--accent); }
#cards { display:flex; }
.card { padding:0 14px; border-left:1px solid var(--line); }
.card b { display:block; font-size:18px; }
.card span { color:var(--muted); font-size:12px; }
main { display:grid; grid-template-columns:320px 1fr; min-height:0; }
#list { overflow:auto; margin:0; padding:0; list-style:none; border-right:1px solid var(--line); }
#list li { padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
#list li.sel { background:var(--panel); box-shadow:inset 3px 0 var(--accent); }
#list small { display:block; color:var(--muted); }
#list .snip { font-style:italic; }
.empty { color:var(--muted); padding:24px; }
#right { min-height:0; display:grid; grid-template-rows:auto 1fr; }
#tabs { display:flex; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); }
#tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
#map, #flow { min-height:0; overflow:auto; }
#map svg { display:block; }
#flow { padding:16px; }
.resume { display:flex; gap:8px; align-items:center; padding:8px; background:var(--panel); border-radius:6px; }
.resume code { flex:1; overflow-x:auto; white-space:nowrap; font-size:12px; }
.msg { margin:8px 0; padding:8px 12px; border-radius:8px; border:1px solid var(--line); }
.msg.user { background:var(--user); }
.msg.assistant { background:var(--asst); }
.msg.tool { background:var(--tool); }
.msg small { display:block; color:var(--muted); }
.body { white-space:pre-wrap; word-break:break-word; }
.folded { cursor:pointer; }
.folded .body { max-height:6em; overflow:hidden; mask-image:linear-gradient(#000 60%, transparent); }
.badge { display:inline-block; font-size:12px; padding:0 6px; margin:2px 4px 2px 0; border-radius:10px; border:1px solid var(--line); }
.gap { text-align:center; color:var(--muted); font-size:12px; }
@media (max-width:700px) {
  main { grid-template-columns:1fr; grid-template-rows:40vh 1fr; }
  #list { border-right:0; border-bottom:1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="대화 내용 검색">
  <details><summary>프로젝트</summary><div id="proj"></div></details>
  <select id="range"><option value="7">7일</option><option value="30">30일</option><option value="0" selected>전체</option></select>
</header>
<section id="dash"><div id="heat"></div><div id="cards"></div></section>
<main>
  <ul id="list"></ul>
  <section id="right">
    <nav id="tabs"><button data-tab="map" class="on">지도</button><button data-tab="flow">대화 흐름</button></nav>
    <div id="map"></div>
    <div id="flow" hidden><p class="empty">세션을 선택하세요</p></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const DAY = 864e5;
const state = { sessions: [], hits: null, projects: new Set(), days: 0, day: null, selected: null };

// 사용자 텍스트가 HTML 로 해석되지 않도록 DOM 은 전부 이 헬퍼로 만든다 (innerHTML 금지)
function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
}
async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}
const dayKey = t => new Date(t).toLocaleDateString('sv');  // 'sv' 로캘이 로컬 시간대 YYYY-MM-DD 를 줌
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);

const matchBase = s => (!state.projects.size || state.projects.has(s.project)) && (!state.hits || state.hits.has(s.id));
function filtered() {
  const since = state.days ? Date.now() - state.days * DAY : 0;
  return state.sessions.filter(s => matchBase(s) && Date.parse(s.end) >= since && (!state.day || dayKey(s.start) === state.day));
}

function renderHeat() {
  // 날짜 필터를 걸어도 다른 날짜를 다시 고를 수 있도록 잔디는 기간·날짜 필터를 무시
  const counts = {};
  state.sessions.filter(matchBase).forEach(s => { const k = dayKey(s.start); counts[k] = (counts[k] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - 7 * 26 - d.getDay());
  const cells = [];
  for (const today = new Date(); d <= today; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d), n = counts[k] || 0;
    const c = el('div', { title: `${k}: 세션 ${n}개`, onclick: () => { state.day = state.day === k ? null : k; render(); } });
    c.style.background = `var(--h${n ? Math.ceil(n / max * 4) : 0})`;
    c.classList.toggle('on', state.day === k);
    cells.push(c);
  }
  $('#heat').replaceChildren(...cells);
}

function renderCards(list) {
  const sum = f => list.reduce((a, s) => a + (s[f] ?? 0), 0);
  const card = (v, label) => el('div', { className: 'card' }, el('b', { textContent: v }), el('span', { textContent: label }));
  $('#cards').replaceChildren(
    card(list.length, '세션'),
    card(list.some(s => s.costUSD != null) ? '$' + sum('costUSD').toFixed(2) : '—', '비용'),
    card(fmt(sum('tokens')), '토큰'),
    card(`+${sum('linesAdded')} / −${sum('linesRemoved')}`, '변경 줄'));
}

function renderList(list) {
  if (!list.length) {
    return $('#list').replaceChildren(el('li', { className: 'empty', textContent: state.sessions.length ? '조건에 맞는 세션이 없습니다' : '세션이 없습니다' }));
  }
  $('#list').replaceChildren(...list.map(s => {
    const li = el('li', { onclick: () => select(s.id) }, s.title,
      el('small', { textContent: `${s.project} · ${dayKey(s.start)} · 메시지 ${s.messageCount}` }));
    if (state.hits) li.append(el('small', { className: 'snip', textContent: '…' + state.hits.get(s.id) + '…' }));
    li.classList.toggle('sel', s.id === state.selected);
    return li;
  }));
}

function renderProjects() {
  const names = [...new Set(state.sessions.map(s => s.project))].sort();
  $('#proj').replaceChildren(...names.map(n => {
    const cb = el('input', { type: 'checkbox', onchange: () => { cb.checked ? state.projects.add(n) : state.projects.delete(n); render(); } });
    return el('label', {}, cb, ' ' + n);
  }));
}

function render() {
  const list = filtered();
  renderHeat();
  renderCards(list);
  renderList(list);
  renderMap(list);
}

function select(id) {
  state.selected = id;
  renderList(filtered());
  d3.selectAll('#map circle').style('stroke', d => d.id === id ? 'var(--fg)' : 'none');
  showTab('flow');
  renderFlow(id);
}

const fmtGap = ms => ms < 36e5 ? Math.round(ms / 6e4) + '분' : (ms / 36e5).toFixed(1) + '시간';

async function renderFlow(id) {
  const s = state.sessions.find(x => x.id === id);
  const box = $('#flow');
  box.replaceChildren(el('p', { className: 'empty', textContent: '불러오는 중…' }));
  let msgs;
  try {
    msgs = await api('/api/session/' + id);
  } catch (err) {
    return box.replaceChildren(el('p', { className: 'empty', textContent: '불러오기 실패: ' + err.message }));
  }
  if (state.selected !== id) return;  // 느린 응답이 더 최근에 고른 세션을 덮어쓰지 않도록
  // 경로에 공백·따옴표가 있어도 셸에 그대로 붙여넣을 수 있게 작은따옴표로 감쌈
  const cmd = `cd '${(s.cwd ?? '~').replaceAll("'", "'\\''")}' && claude --resume ${id}`;
  const code = el('code', { textContent: cmd });
  const copy = el('button', { textContent: '복사' });
  copy.onclick = () => navigator.clipboard.writeText(cmd).then(
    () => { copy.textContent = '복사됨'; },
    // 클립보드 권한이 막힌 브라우저에서도 손으로 복사할 수 있게 명령을 선택해 둠
    () => { getSelection().selectAllChildren(code); copy.textContent = '⌘C 로 복사'; });
  let prev = null;
  const items = msgs.flatMap(m => {
    const t = Date.parse(m.timestamp), gap = prev ? t - prev : 0;
    prev = t;
    const card = el('div', { className: 'msg ' + (m.text ? m.role : 'tool') },
      el('small', { textContent: `${m.role === 'user' ? '나' : 'Claude'} · ${new Date(t).toLocaleString()}` }),
      ...m.tools.map(n => el('span', { className: 'badge', textContent: n })),
      el('div', { className: 'body', textContent: m.text }));
    if (m.text.length > 300) {
      card.classList.add('folded');
      card.onclick = () => card.classList.toggle('folded');
    }
    return gap > 6e4 ? [el('div', { className: 'gap', textContent: '+' + fmtGap(gap) }), card] : [card];
  });
  box.replaceChildren(el('div', { className: 'resume' }, code, copy),
    el('h3', { textContent: s.title }), ...items);
}

function showTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $('#map').hidden = name !== 'map';
  $('#flow').hidden = name !== 'flow';
  if (name === 'map') renderMap(filtered());
}
$('#tabs').onclick = e => e.target.dataset.tab && showTab(e.target.dataset.tab);

let sim;
function renderMap(list) {
  const box = $('#map');
  if (box.hidden) return;
  sim?.stop();
  if (!list.length) return box.replaceChildren(el('p', { className: 'empty', textContent: '표시할 세션이 없습니다' }));
  const { width: W, height: H } = box.getBoundingClientRect();
  const now = Date.now(), oldest = Math.min(now - DAY, ...list.map(s => Date.parse(s.start)));
  const nodes = [
    ...[...new Set(list.map(s => s.project))].map(p => ({ id: 'p:' + p, label: p, r: 18, project: true })),
    ...list.map(s => ({ id: s.id, label: s.title, r: Math.min(24, 4 + Math.sqrt(s.messageCount) * 1.5), s })),
  ];
  const links = list.map(s => ({ source: 'p:' + s.project, target: s.id }));
  const svg = d3.create('svg').attr('viewBox', [0, 0, W, H]).attr('width', W).attr('height', H);
  const link = svg.append('g').style('stroke', 'var(--line)').selectAll('line').data(links).join('line');
  // SVG 속성(fill=) 에는 CSS 변수가 안 먹어서 색은 전부 style 로 지정
  const node = svg.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r', d => d.r)
    .style('fill', d => d.project ? 'var(--muted)' : 'var(--accent)')
    .style('fill-opacity', d => d.project ? 0.5 : 0.25 + 0.75 * (Date.parse(d.s.start) - oldest) / (now - oldest))
    .style('stroke', d => d.id === state.selected ? 'var(--fg)' : 'none')
    .style('stroke-width', 2)
    .style('cursor', d => d.project ? 'grab' : 'pointer')
    .on('click', (e, d) => d.project || select(d.id))
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));
  node.append('title').text(d => d.project ? d.label : `${d.label}\n${dayKey(d.s.start)} · 메시지 ${d.s.messageCount}`);
  const label = svg.append('g').selectAll('text').data(nodes.filter(d => d.project)).join('text')
    .text(d => d.label).attr('font-size', 11).attr('text-anchor', 'middle').attr('dy', -22).style('fill', 'var(--fg)');
  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(40))
    .force('charge', d3.forceManyBody().strength(-30))
    .force('collide', d3.forceCollide(d => d.r + 1))
    .force('center', d3.forceCenter(W / 2, H / 2))
    // 프로젝트 무리끼리는 링크가 없어 서로 밀어내며 화면 밖으로 흩어지므로 중앙으로 당김
    .force('x', d3.forceX(W / 2).strength(0.08))
    .force('y', d3.forceY(H / 2).strength(0.08))
    .on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('cx', d => d.x).attr('cy', d => d.y);
      label.attr('x', d => d.x).attr('y', d => d.y);
    });
  box.replaceChildren(svg.node());
}

let timer;
$('#q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const q = e.target.value.trim();
    try {
      state.hits = q ? new Map((await api('/api/search?q=' + encodeURIComponent(q))).map(h => [h.id, h.snippet])) : null;
    } catch (err) {
      state.hits = new Map();
      console.error(err);
    }
    render();
  }, 300);
};
$('#range').onchange = e => { state.days = +e.target.value; render(); };

api('/api/sessions')
  .then(s => { state.sessions = s; renderProjects(); render(); })
  .catch(err => $('#list').replaceChildren(el('li', { className: 'empty', textContent: '서버 오류: ' + err.message })));
</script>
</body>
</html>
